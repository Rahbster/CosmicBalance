<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="premiumMetal" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="2" result="diffuse">
        <feDistantLight azimuth="45" elevation="55" />
      </feDiffuseLighting>
      <feSpecularLighting in="noise" specularExponent="40" lighting-color="#ffffff" surfaceScale="1" result="specular">
        <feDistantLight azimuth="45" elevation="55" />
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceGraphic" operator="in" result="specOut" />
      <feComposite in="diffuse" in2="SourceGraphic" operator="in" result="diffOut" />
      <feBlend in="SourceGraphic" in2="diffOut" mode="multiply" result="textured" />
      <feBlend in="textured" in2="specOut" mode="screen" />
    </filter>
    
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b0c4de" />
      <stop offset="50%" style="stop-color:#4682b4" />
      <stop offset="100%" style="stop-color:#1a2533" />
    </linearGradient>
  </defs>

  <!-- Habitation Ring Design -->
  <g filter="url(#premiumMetal)">
    <path d="M64 14 A50 50 0 1 0 64 114 A50 50 0 1 0 64 14 M64 24 A40 40 0 1 1 64 104 A40 40 0 1 1 64 24 Z" fill="url(#ringGrad)" />
    <circle cx="64" cy="64" r="18" fill="url(#ringGrad)" />
    <rect x="62" y="14" width="4" height="10" fill="#444" />
    <rect x="62" y="104" width="4" height="10" fill="#444" />
    <rect x="14" y="62" width="10" height="4" fill="#444" />
    <rect x="104" y="62" width="10" height="4" fill="#444" />
  </g>

  <!-- Angled Panels -->
  <g>
    <rect x="15" y="15" width="20" height="10" fill="#001a33" stroke="#4488ff" stroke-width="0.5" transform="rotate(-45 25 20)" />
    <rect x="93" y="15" width="20" height="10" fill="#001a33" stroke="#4488ff" stroke-width="0.5" transform="rotate(45 103 20)" />
    <rect x="15" y="103" width="20" height="10" fill="#001a33" stroke="#4488ff" stroke-width="0.5" transform="rotate(45 25 108)" />
    <rect x="93" y="103" width="20" height="10" fill="#001a33" stroke="#4488ff" stroke-width="0.5" transform="rotate(-45 103 108)" />
  </g>

  <g fill="#ffff00" opacity="0.9">
    <circle cx="64" cy="20" r="1" />
    <circle cx="64" cy="108" r="1" />
    <circle cx="20" cy="64" r="1" />
    <circle cx="104" cy="64" r="1" />
  </g>
</svg>
