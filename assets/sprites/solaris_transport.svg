<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#99abbb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#667788;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334455;stop-opacity:1" />
    </linearGradient>
    <filter id="metal" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" />
      <feColorMatrix type="matrix" values="0.3 0 0 0 0.5, 0 0.3 0 0 0.5, 0 0 0.3 0 0.5, 0 0 0 0.7 0" />
    </filter>
    <clipPath id="hullClip">
      <rect x="40" y="15" width="48" height="85" rx="2" />
      <rect x="30" y="35" width="68" height="45" rx="1" />
      <rect x="35" y="80" width="58" height="15" rx="1" />
    </clipPath>
  </defs>
  
  <g fill="url(#grad)">
    <rect x="40" y="15" width="48" height="85" rx="2" />
    <rect x="30" y="35" width="68" height="45" rx="1" />
    <rect x="35" y="80" width="58" height="15" rx="1" />
  </g>
  
  <rect x="0" y="0" width="128" height="128" filter="url(#metal)" clip-path="url(#hullClip)" pointer-events="none" />
  
  <!-- Rivet/Plating Lines -->
  <g stroke="#222" stroke-width="0.5" opacity="0.3">
    <path d="M40 35 H88 M40 55 H88 M40 75 H88" />
    <path d="M52 15 V100 M76 15 V100" />
  </g>
  
  <rect x="54" y="20" width="20" height="4" fill="#00ffff" opacity="0.8" />
</svg>
