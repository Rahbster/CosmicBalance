<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="rustNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.1" numOctaves="5" />
      <feColorMatrix type="matrix" values="0.5 0 0 0 0.3  0 0.3 0 0 0.1  0 0 0.2 0 0  0 0 0 1 0" />
      <feComposite in2="SourceGraphic" operator="in" />
    </filter>

    <linearGradient id="scrapMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#555" />
      <stop offset="100%" style="stop-color:#222" />
    </linearGradient>
  </defs>

  <!-- Junk-Rigger Destroyer Hull (Asymmetrical) -->
  <g filter="url(#rustNoise)">
    <!-- Main Chassis -->
    <rect x="50" y="20" width="28" height="80" rx="1" fill="url(#scrapMetal)" />
    
    <!-- Left Scrap Plate (Larger) -->
    <path d="M25 40 L50 35 L50 90 L30 100 Z" fill="#444" stroke="#111" />
    
    <!-- Right Exposed Support Beam -->
    <rect x="78" y="30" width="8" height="60" fill="#333" stroke="#000" />
    
    <!-- Front Ram/Spike -->
    <path d="M64 5 L75 25 L53 25 Z" fill="#222" />
  </g>

  <!-- Exposed Tech and Wiring -->
  <g>
    <!-- Red Wiring on beam -->
    <path d="M78 40 L86 45 L78 50 L86 55 L78 60" fill="none" stroke="#ff4400" stroke-width="1" />
    
    <!-- Flickering Thermal Core -->
    <rect x="58" y="60" width="12" height="15" fill="#ffaa00">
      <animate attributeName="opacity" values="0.4;1;0.6;1;0.4" dur="0.2s" repeatCount="indefinite" />
    </rect>

    <!-- Dirty Exhaust Flashes -->
    <circle cx="56" cy="105" r="5" fill="#553300" opacity="0.6" />
    <circle cx="72" cy="105" r="4" fill="#553300" opacity="0.6" />
  </g>
</svg>
