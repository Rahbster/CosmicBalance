<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hiFiShip" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="2" result="diffuse">
        <feDistantLight azimuth="45" elevation="55" />
      </feDiffuseLighting>
      <feSpecularLighting in="noise" specularExponent="25" lighting-color="#ffffff" surfaceScale="1.2" result="specular">
        <feDistantLight azimuth="45" elevation="55" />
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceGraphic" operator="in" result="specOut" />
      <feComposite in="diffuse" in2="SourceGraphic" operator="in" result="diffOut" />
      <feBlend in="SourceGraphic" in2="diffOut" mode="multiply" result="textured" />
      <feBlend in="textured" in2="specOut" mode="screen" />
    </filter>
    
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="50%" style="stop-color:#00a0c0" />
      <stop offset="100%" style="stop-color:#003366" />
    </linearGradient>
  </defs>

  <!-- Large Segmented Hull -->
  <g filter="url(#hiFiShip)">
    <!-- Main Spindle -->
    <path d="M64 5 L80 20 L80 100 L64 120 L48 100 L48 20 Z" fill="url(#hullGrad)" />
    <!-- Broadside Batteries -->
    <rect x="75" y="30" width="15" height="60" rx="2" fill="url(#hullGrad)" />
    <rect x="38" y="30" width="15" height="60" rx="2" fill="url(#hullGrad)" />
    <!-- Rear Thruster Cowlings -->
    <path d="M48 100 L30 115 L35 125 L64 110 L93 125 L98 115 L80 100 Z" fill="#444" />
  </g>

  <!-- Plating and Technical Detail -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="0.5" fill="none">
    <path d="M64 5 V110 M48 30 H80 M48 60 H80 M48 90 H80" />
    <path d="M75 40 H90 M75 55 H90 M75 70 H90" />
    <path d="M38 40 H53 M38 55 H53 M38 70 H53" />
  </g>

  <!-- Turrets (Small Greebles) -->
  <g fill="#111">
    <circle cx="82" cy="45" r="2" />
    <circle cx="82" cy="75" r="2" />
    <circle cx="46" cy="45" r="2" />
    <circle cx="46" cy="75" r="2" />
  </g>

  <!-- Bridge -->
  <rect x="60" y="25" width="8" height="12" fill="#00ffff" opacity="0.6" />

  <!-- Engine Burn -->
  <g>
    <path d="M40 120 Q50 135 64 125 Q78 135 88 120" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.4" />
  </g>
</svg>
