<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hiFiBioShip" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#ff00ff" surfaceScale="2.5" result="diffuse">
        <fePointLight x="64" y="64" z="40" />
      </feDiffuseLighting>
      <feSpecularLighting in="noise" specularExponent="15" lighting-color="#ffffff" surfaceScale="1" result="specular">
        <fePointLight x="64" y="64" z="40" />
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceGraphic" operator="in" result="specOut" />
      <feComposite in="diffuse" in2="SourceGraphic" operator="in" result="diffOut" />
      <feBlend in="SourceGraphic" in2="diffOut" mode="screen" result="textured" />
      <feBlend in="textured" in2="specOut" mode="screen" />
    </filter>
    
    <radialGradient id="fleshGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff99cc" />
      <stop offset="70%" style="stop-color:#d400ff" />
      <stop offset="100%" style="stop-color:#1a002a" />
    </radialGradient>
  </defs>

  <!-- Large Pulsing Organism -->
  <g filter="url(#hiFiBioShip)">
    <!-- Central Body -->
    <ellipse cx="64" cy="64" rx="35" ry="55" fill="url(#fleshGrad)" />
    <!-- Bio-Sails/Fins -->
    <path d="M64 20 Q110 40 100 80 Q64 70 28 80 Q18 40 64 20" fill="url(#fleshGrad)" opacity="0.8" />
    <!-- Rear Propulsion Tentacles -->
    <path d="M45 100 Q40 125 30 115 M83 100 Q88 125 98 115" stroke="url(#fleshGrad)" stroke-width="8" fill="none" stroke-linecap="round" />
  </g>

  <!-- Glowing Nerve Clusters -->
  <g fill="#ff00ff" opacity="0.8">
    <circle cx="64" cy="40" r="4" />
    <circle cx="50" cy="55" r="3" />
    <circle cx="78" cy="55" r="3" />
    <circle cx="55" cy="75" r="3" />
    <circle cx="73" cy="75" r="3" />
  </g>

  <!-- Main Eye/Core -->
  <circle cx="64" cy="64" r="8" fill="#ffffff" opacity="0.6" />
  <circle cx="64" cy="64" r="4" fill="#00ffff" />

  <!-- Bio-Electric Discharge -->
  <path d="M30 40 Q10 64 30 88 M98 40 Q118 64 98 88" stroke="#ff00ff" stroke-width="1" fill="none" stroke-dasharray="2 4" opacity="0.5" />
</svg>
