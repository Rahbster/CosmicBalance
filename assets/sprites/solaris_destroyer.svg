<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00a0c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004060;stop-opacity:1" />
    </linearGradient>
    <filter id="metal" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="5" result="noise" />
      <feComposite in="noise" in2="SourceGraphic" operator="in" result="clippedNoise" />
      <feBlend in="SourceGraphic" in2="clippedNoise" mode="multiply" />
    </filter>
  </defs>
  <g filter="url(#metal)">
    <path d="M64 5 L110 50 L110 110 L64 123 L18 110 L18 50 Z" fill="url(#grad)" stroke="#ffffff" stroke-width="2.5" />
    <rect x="40" y="30" width="48" height="15" rx="3" fill="rgba(0,255,255,0.2)" stroke="#ffffff" stroke-width="1" />
    <!-- Turrets -->
    <circle cx="45" cy="70" r="5" fill="#333" stroke="#fff" />
    <circle cx="83" cy="70" r="5" fill="#333" stroke="#fff" />
  </g>
</svg>
