<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hiFiBio" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#ff00ff" surfaceScale="3" result="diffuse">
        <fePointLight x="64" y="64" z="50" />
      </feDiffuseLighting>
      <feComposite in="diffuse" in2="SourceGraphic" operator="in" />
      <feBlend in="SourceGraphic" in2="diffuse" mode="screen" />
    </filter>
    
    <radialGradient id="fleshGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff66cc" />
      <stop offset="60%" style="stop-color:#990066" />
      <stop offset="100%" style="stop-color:#330033" />
    </radialGradient>

    <clipPath id="stationClip">
      <circle cx="64" cy="64" r="35" />
      <path d="M64 64 L100 20 L110 30 L64 64" />
      <path d="M64 64 L28 108 L18 98 L64 64" />
      <path d="M64 64 L120 80 L115 95 L64 64" />
      <path d="M64 64 L8 40 L18 30 L64 64" />
    </clipPath>
  </defs>

  <!-- Bio-Mechanical Legs/Tentacles -->
  <g stroke="#660044" stroke-width="4" fill="none">
    <path d="M64 64 Q110 10 100 20" />
    <path d="M64 64 Q20 120 30 110" />
    <path d="M64 64 Q130 90 120 80" />
    <path d="M64 64 Q0 30 10 40" />
  </g>

  <!-- Main Central Organism -->
  <g filter="url(#hiFiBio)">
    <circle cx="64" cy="64" r="35" fill="url(#fleshGrad)" />
    <!-- Internal Veins -->
    <path d="M40 64 Q64 40 88 64 Q64 88 40 64" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  </g>

  <!-- Glowing Spores and Eyes -->
  <g>
    <circle cx="64" cy="64" r="8" fill="#ffffff" opacity="0.8" />
    <circle cx="64" cy="64" r="4" fill="#00ffff" />
    
    <circle cx="95" cy="25" r="5" fill="#ff00ff" />
    <circle cx="33" cy="103" r="6" fill="#ff00ff" />
    <circle cx="115" cy="85" r="4" fill="#ff00ff" />
    <circle cx="13" cy="43" r="5" fill="#ff00ff" />
  </g>

  <!-- Pulse Ring -->
  <circle cx="64" cy="64" r="45" fill="none" stroke="#ff00ff" stroke-width="1" stroke-dasharray="2 10" opacity="0.4" />
</svg>
