<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="industrialMetal" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="1" result="diffuse">
        <feDistantLight azimuth="45" elevation="55" />
      </feDiffuseLighting>
      <feComposite in="diffuse" in2="SourceGraphic" operator="in" />
    </filter>
    
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#778899" />
      <stop offset="50%" style="stop-color:#445566" />
      <stop offset="100%" style="stop-color:#223344" />
    </linearGradient>

    <linearGradient id="engineGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff" />
      <stop offset="100%" style="stop-color:#0088ff" />
    </linearGradient>
  </defs>

  <!-- Heavy Armored Hull -->
  <g filter="url(#industrialMetal)">
    <!-- Central Spine -->
    <rect x="54" y="10" width="20" height="100" rx="2" fill="url(#hullGrad)" />
    
    <!-- Forward Prow Sections -->
    <path d="M44 20 L84 20 L94 40 L34 40 Z" fill="url(#hullGrad)" stroke="#111" stroke-width="1" />
    
    <!-- Heavy Side Sponsons -->
    <rect x="30" y="45" width="20" height="40" rx="3" fill="url(#hullGrad)" stroke="#111" />
    <rect x="78" y="45" width="20" height="40" rx="3" fill="url(#hullGrad)" stroke="#111" />
    
    <!-- Rear Thruster Housing -->
    <path d="M40 90 L88 90 L95 115 L33 115 Z" fill="#222" stroke="#111" />
  </g>

  <!-- Industrial Detail Layer (No Filter for Sharpness) -->
  <g>
    <!-- Orange Warning Stripes -->
    <rect x="32" y="55" width="16" height="4" fill="#ff8800" opacity="0.8" />
    <rect x="80" y="55" width="16" height="4" fill="#ff8800" opacity="0.8" />
    <rect x="56" y="25" width="16" height="2" fill="#ff8800" />

    <!-- Blue Engine Cores -->
    <rect x="44" y="110" width="10" height="6" fill="url(#engineGlow)" />
    <rect x="60" y="112" width="8" height="6" fill="url(#engineGlow)" />
    <rect x="74" y="110" width="10" height="6" fill="url(#engineGlow)" />

    <!-- Mechanical Greebles -->
    <path d="M54 45 H74 M54 55 H74 M54 65 H74" stroke="#000" stroke-width="0.5" opacity="0.5" />
    <circle cx="64" cy="30" r="3" fill="#333" stroke="#000" />
    <rect x="62" y="28" width="4" height="4" fill="#ff0000" />
  </g>

  <!-- Cockpit/Bridge Window -->
  <path d="M58 35 L70 35 L68 40 L60 40 Z" fill="#00ffff" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite" />
  </path>
</svg>
