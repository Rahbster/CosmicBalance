<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Complex Metal Texture with Specular Highlights -->
    <filter id="hiFiMetal" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="2" result="diffuse">
        <feDistantLight azimuth="45" elevation="55" />
      </feDiffuseLighting>
      <feSpecularLighting in="noise" specularExponent="20" lighting-color="#ffffff" surfaceScale="1" result="specular">
        <feDistantLight azimuth="45" elevation="55" />
      </feSpecularLighting>
      <feComposite in="specular" in2="SourceGraphic" operator="in" result="specOut" />
      <feComposite in="diffuse" in2="SourceGraphic" operator="in" result="diffOut" />
      <feBlend in="SourceGraphic" in2="diffOut" mode="multiply" result="textured" />
      <feBlend in="textured" in2="specOut" mode="screen" />
    </filter>
    
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc00" />
      <stop offset="50%" style="stop-color:#ff9900" />
      <stop offset="100%" style="stop-color:#cc6600" />
    </linearGradient>
    
    <radialGradient id="cockpitGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
    </radialGradient>

    <clipPath id="fighterClip">
      <!-- High Detail Wing/Hull Shape -->
      <path d="M64 5 L85 40 L120 70 L110 110 L64 90 L18 110 L8 70 L43 40 Z" />
    </clipPath>
  </defs>

  <!-- Main Hull Structure -->
  <g filter="url(#hiFiMetal)">
    <!-- Base Plate -->
    <path d="M64 5 L85 40 L120 70 L110 110 L64 90 L18 110 L8 70 L43 40 Z" fill="url(#hullGrad)" />
    
    <!-- Secondary Wing Layers -->
    <path d="M64 30 L110 75 L100 100 L64 85 Z" fill="#ffaa00" opacity="0.8" />
    <path d="M64 30 L18 75 L28 100 L64 85 Z" fill="#ffaa00" opacity="0.8" />
    
    <!-- Engine Housings -->
    <rect x="90" y="80" width="15" height="30" rx="2" fill="#444" />
    <rect x="23" y="80" width="15" height="30" rx="2" fill="#444" />
  </g>

  <!-- Specular Highlights (Hand-placed for sharpness) -->
  <g stroke="#fff" stroke-width="0.8" opacity="0.4" fill="none">
    <path d="M64 10 L82 38 M64 10 L46 38" />
    <path d="M115 72 L105 105" />
    <path d="M13 72 L23 105" />
  </g>

  <!-- Cockpit -->
  <path d="M64 15 Q72 40 64 65 Q56 40 64 15" fill="url(#cockpitGrad)" stroke="#00ffff" stroke-width="0.5" />
  
  <!-- Greebles/Details -->
  <g fill="#333" opacity="0.5">
    <rect x="62" y="70" width="4" height="15" />
    <rect x="50" y="55" width="8" height="4" />
    <rect x="70" y="55" width="8" height="4" />
  </g>

  <!-- Engine Glow -->
  <g>
    <rect x="92" y="105" width="11" height="8" fill="#00ffff" opacity="0.6" />
    <rect x="25" y="105" width="11" height="8" fill="#00ffff" opacity="0.6" />
  </g>
</svg>
