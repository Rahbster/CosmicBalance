<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bioGloss" x="-20%" y="-20%" width="140%" height="140%">
      <feSpecularLighting surfaceScale="2" specularConstant="1.2" specularExponent="40" lighting-color="#ff00ff">
        <feDistantLight azimuth="225" elevation="60" />
      </feSpecularLighting>
      <feComposite in2="SourceGraphic" operator="in" />
    </filter>

    <linearGradient id="syndicateHull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a0052" />
      <stop offset="100%" style="stop-color:#050010" />
    </linearGradient>

    <radialGradient id="nerveGlow">
      <stop offset="0%" style="stop-color:#ff00ff" />
      <stop offset="100%" style="stop-color:#440044" />
    </radialGradient>
  </defs>

  <!-- Sleek Bio-Mechanical Hull -->
  <g>
    <!-- Main Needle Body -->
    <path d="M64 10 L80 110 L64 120 L48 110 Z" fill="url(#syndicateHull)" filter="url(#bioGloss)" />
    
    <!-- Curved Swept Wings -->
    <path d="M64 40 C 90 40, 110 80, 100 110 L80 90 Z" fill="url(#syndicateHull)" filter="url(#bioGloss)" />
    <path d="M64 40 C 38 40, 18 80, 28 110 L48 90 Z" fill="url(#syndicateHull)" filter="url(#bioGloss)" />
  </g>

  <!-- Glowing Nerve Lines -->
  <g>
    <path d="M64 30 L64 90" stroke="#ff00ff" stroke-width="1.5" opacity="0.8">
       <animate attributeName="stroke-width" values="1;2.5;1" dur="2s" repeatCount="indefinite" />
    </path>
    <circle cx="64" cy="30" r="4" fill="url(#nerveGlow)">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Wing Nerve Clusters -->
    <circle cx="85" cy="80" r="2" fill="#ff00ff" />
    <circle cx="43" cy="80" r="2" fill="#ff00ff" />
  </g>

  <!-- Plasma Exhaust -->
  <path d="M54 115 L64 125 L74 115 Z" fill="#ff00ff" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="0.5s" repeatCount="indefinite" />
  </path>
</svg>
