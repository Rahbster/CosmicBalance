<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#d400ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a002a;stop-opacity:1" />
    </radialGradient>
    <filter id="organic" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.2" numOctaves="2" result="noise" />
      <feComposite in="noise" in2="SourceGraphic" operator="in" result="clippedNoise" />
      <feBlend in="SourceGraphic" in2="clippedNoise" mode="multiply" />
    </filter>
  </defs>
  <g filter="url(#organic)">
    <circle cx="64" cy="64" r="22" fill="url(#grad)" stroke="#d400ff" stroke-width="1.5" />
    <path d="M64 25 C110 35 110 93 64 103 C18 93 18 35 64 25 Z" fill="rgba(212,0,255,0.05)" stroke="#d400ff" stroke-width="1" />
  </g>
  <circle cx="64" cy="64" r="6" fill="#ff00ff" />
</svg>
