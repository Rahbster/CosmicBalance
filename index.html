<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cosmic Balance</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0d10">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/lobby.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/peer.css">

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('ServiceWorker registration successful');
                }, err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</head>
<body class="dark">
    <div id="app">
        <!-- TOP HEADER (Game Only) -->
        <header class="app-header hidden" id="game-header">
            <button id="hamburger-btn" aria-label="Open Menu">☰</button>
            <h1>Cosmic Balance</h1>
            <div id="connection-status" class="connection-status disconnected" title="Disconnected"></div>
            
            <div id="host-view-controls" class="hidden" style="display: flex; align-items: center; gap: 10px; margin-left: 15px; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 15px;">
                <select id="host-view-select" style="background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 4px; font-size: 0.85rem;">
                    <option value="god">Spectator (God View)</option>
                    <option value="player">Single Player View</option>
                    <option value="faction">Faction View</option>
                </select>
                <select id="host-faction-select" class="hidden" style="background: rgba(0,0,0,0.3); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 4px; font-size: 0.85rem;">
                    <!-- Populated by JS -->
                </select>
            </div>

            <div id="header-controls" class="hidden" style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
                <div style="display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 15px;">
                    <span style="font-size: 0.8rem; color: #aaa;">Speed</span>
                    <input type="range" id="game-speed-slider" min="0.1" max="5" step="0.1" value="1" style="width: 80px; cursor: pointer;">
                    <span id="game-speed-value" style="font-size: 0.9rem; font-family: monospace; min-width: 35px; text-align: right;">1.0x</span>
                </div>
                <button id="header-pause-btn" style="background: transparent; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-color, #fff); padding: 0 5px;" aria-label="Pause Game">⏸️</button>
            </div>
        </header>

        <!-- LOBBY SCREEN (Initial View) -->
        <section id="lobby-screen" class="screen">
            <div class="lobby-background">
                <div class="stars"></div>
                <div class="twinkle"></div>
            </div>
            
            <header class="lobby-header">
                <button id="lobby-hamburger-btn" class="icon-btn" title="Settings">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="lobby-title-area">
                    <h1 class="orbitron">Cosmic<span class="highlight">Balance</span></h1>
                    <p class="subtitle">Tactical Space Strategy</p>
                </div>
                <button id="btn-open-radar" class="icon-btn" title="Friends Radar">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="6"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                        <line x1="12" y1="2" x2="12" y2="22"></line>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                    </svg>
                </button>
            </header>

            <div class="lobby-carousel-viewport">
                <!-- 3D Carousel Injected Here by JS -->
                <div id="main-lobby-carousel" class="stellar-carousel"></div>
                
                <div class="lobby-carousel-controls">
                    <button id="lobby-prev-btn" class="icon-btn" title="Previous">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 18l-6-6 6-6"></path></svg>
                    </button>
                    <div id="lobby-dot-nav" class="stellar-nav"></div>
                    <button id="lobby-next-btn" class="icon-btn" title="Next">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 6l6 6-6 6"></path></svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- SIDENAV (Drawer for Settings) -->
        <div id="sidenav" class="sidenav">
            <a href="javascript:void(0)" class="closebtn" id="close-sidenav-btn">&times;</a>
            <h2 class="orbitron">Settings</h2>
            <div class="sidenav-item">
                <button id="btn-install-pwa" style="width: 100%; margin-bottom: 0.5rem;" class="hidden">Install App</button>
                <button id="btn-open-peer-modal" style="width: 100%;">Connection Settings</button>
                <button id="design-lab-btn" style="width: 100%; margin-top: 0.5rem; border: 1px solid #00ffff; color: #00ffff;">Ship Design Lab</button>
                <button id="btn-open-logging-modal" style="width: 100%; margin-top: 0.5rem;">Logging Console</button>
                <button id="btn-transfer-host" class="hidden" style="width: 100%; margin-top: 0.5rem; background-color: var(--secondary-color); color: white;">Transfer Command</button>
            </div>
            <hr style="margin: 0.5rem 2rem; border: 0; border-top: 1px solid var(--border-color);">
            <div class="sidenav-item">
                <label for="settings-name">Commander Name:</label>
                <input type="text" id="settings-name" placeholder="Enter name">
            </div>
            <div class="sidenav-item">
                <span>Interface Theme</span>
                <button id="theme-toggle" aria-label="Toggle Theme">🌓</button>
            </div>
            <input type="color" id="hidden-custom-color" class="hidden">
            <hr style="margin: 0.5rem 2rem; border: 0; border-top: 1px solid var(--border-color);">
            <div class="sidenav-item">
                <h3 class="orbitron" style="font-size: 1rem; margin-bottom: 0.5rem; color: var(--primary-color);">Radar Database</h3>
                <ul id="sidenav-friends-list" style="list-style: none; padding: 0; margin: 0; font-size: 0.9rem; max-height: 200px; overflow-y: auto;">
                    <!-- Populated by JS -->
                </ul>
            </div>
        </div>
        <div id="overlay" class="overlay"></div>

        <!-- GAME VIEW -->
        <main id="game-view" class="hidden">
            <div id="resource-display" class="resource-display">
                <div id="resource-list"></div>
                <hr style="width: 100%; border: 0; border-top: 1px solid var(--border-color); margin: 5px 0;">
                <div id="system-list" style="display: flex; flex-direction: column; width: 100%;"></div>
            </div>
            <div id="selected-planet-info" class="hidden"></div>
            
            <button id="btn-open-ship-designer" class="theme-button" style="position: absolute; bottom: 60px; right: 20px; z-index: 100;">Designer</button>
            <button id="btn-return-to-lobby" class="theme-button" style="position: absolute; bottom: 20px; left: 20px; z-index: 100;">Lobby</button>
            
            <canvas id="game-canvas"></canvas>
        </main>

        <!-- MODALS -->
        <div id="chat-modal" class="modal hidden">
            <div class="modal-content">
                <span id="close-chat-modal" class="close-modal">&times;</span>
                <h2 class="orbitron">Comms Channel</h2>
                <div id="peer-chat">
                    <div id="messages"></div>
                    <div class="chat-input-area">
                        <select id="chat-scope">
                            <option value="GLOBAL">Global</option>
                            <option value="TEAM">Team</option>
                        </select>
                        <input type="text" id="msg-input" placeholder="Type transmission...">
                        <button id="btn-send">Send</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="scout-report-modal" class="modal hidden">
            <div class="modal-content">
                <span id="close-scout-report-modal" class="close-modal">&times;</span>
                <h2 class="orbitron">Intel Report</h2>
                <div id="scout-report-content"></div>
            </div>
        </div>

        <!-- Toast Container -->
        <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>
    </div>

    <!-- Scripts -->
    <script src="js/vendor/peerjs.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
